name: Build PvP Learner

on:
  push:
    branches: [ main, "feature/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build mod
        run: gradle build --no-daemon
      - name: Report output sizes
        shell: bash
        run: |
          set -euo pipefail
          find build/libs -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvp-learner-1.21.11
          path: |
            build/libs/*.jar
            README.md
          if-no-files-found: error
